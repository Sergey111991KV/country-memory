<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="goBack()">
        <ion-icon slot="icon-only" name="arrow-back" aria-hidden="true"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>{{ modeTitleKey | i18n }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding pass-play-page">
  <h1 class="pass-play-page__title">{{ 'passPlay.title' | i18n }}</h1>
  <p class="pass-play-page__lead">{{ leadKey | i18n }}</p>

  <div class="pass-play-page__players">
    <label
      class="pass-play-page__field"
      *ngFor="let name of playerNames; let i = index"
    >
      <span class="pass-play-page__label">
        {{ 'passPlay.playerLabel' | i18n: { n: i + 1 } }}
      </span>
      <div class="pass-play-page__row">
        <ion-input
          [(ngModel)]="playerNames[i]"
          [attr.aria-label]="'passPlay.playerLabel' | i18n: { n: i + 1 }"
        ></ion-input>
        <ion-button
          *ngIf="playerNames.length > 2"
          fill="clear"
          size="small"
          (click)="removePlayer(i)"
          [attr.aria-label]="'passPlay.removePlayer' | i18n"
        >
          <ion-icon slot="icon-only" name="close" aria-hidden="true"></ion-icon>
        </ion-button>
      </div>
    </label>
  </div>

  <ion-button
    *ngIf="canAddPlayer"
    fill="outline"
    expand="block"
    class="pass-play-page__add"
    (click)="addPlayer()"
  >
    {{ 'passPlay.addPlayer' | i18n }}
  </ion-button>

  <ion-button
    expand="block"
    class="pass-play-page__start"
    [disabled]="!canStart || starting"
    (click)="startGame()"
  >
    {{ 'passPlay.start' | i18n }}
  </ion-button>
</ion-content>
