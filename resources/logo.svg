<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" fill="none" role="img" aria-label="Flagfield">
  <!-- Capacitor/legacy master: full square, NO baked corner radius (iOS masks). -->
  <defs>
    <linearGradient id="ff-bg" x1="180" y1="80" x2="860" y2="960" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2563EB"/>
      <stop offset="0.55" stop-color="#1D4ED8"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <clipPath id="flag-shape">
      <rect x="332" y="372" width="360" height="280" rx="44"/>
    </clipPath>
  </defs>

  <rect width="1024" height="1024" fill="url(#ff-bg)"/>

  <circle cx="512" cy="512" r="300" stroke="#FFFFFF" stroke-width="30" stroke-opacity="0.92"/>
  <ellipse cx="512" cy="512" rx="120" ry="300" stroke="#FFFFFF" stroke-width="16" stroke-opacity="0.55"/>
  <path d="M212 512H812" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" stroke-opacity="0.55"/>

  <g transform="rotate(-12 512 512)">
    <g clip-path="url(#flag-shape)">
      <rect x="332" y="372" width="360" height="94" fill="#2563EB"/>
      <rect x="332" y="466" width="360" height="94" fill="#FFFFFF"/>
      <rect x="332" y="560" width="360" height="92" fill="#EF4444"/>
    </g>
  </g>
</svg>
